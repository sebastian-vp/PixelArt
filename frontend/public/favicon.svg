<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Fondo tipo lienzo -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="#17171f"/>

  <!-- Líneas de la grilla (canvas de pixel art) -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <line x1="10" y1="4"  x2="10" y2="28"/>
    <line x1="16" y1="4"  x2="16" y2="28"/>
    <line x1="22" y1="4"  x2="22" y2="28"/>
    <line x1="4"  y1="10" x2="28" y2="10"/>
    <line x1="4"  y1="16" x2="28" y2="16"/>
    <line x1="4"  y1="22" x2="28" y2="22"/>
  </g>

  <!-- Diagonal de píxeles (paleta de colores) -->
  <rect x="22" y="4"  width="6" height="6" fill="#ff5c7c"/>
  <rect x="16" y="10" width="6" height="6" fill="#ffd166"/>
  <rect x="10" y="16" width="6" height="6" fill="#06d6a0"/>
  <rect x="4"  y="22" width="6" height="6" fill="#4d96ff"/>
</svg>
